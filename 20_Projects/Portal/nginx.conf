# Deploy this file to /etc/nginx/conf.d/finejang-portal.conf.
# The repository is intentionally the document root so linked study material remains available.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/FineJnag_repo;
    charset utf-8;

    location = / {
        try_files /20_Projects/Portal/index.html =404;
    }

    location / {
        try_files $uri $uri/ /20_Projects/Portal/index.html;
    }

    location ~ /\. {
        deny all;
    }
}
